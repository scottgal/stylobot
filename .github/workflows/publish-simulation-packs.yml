name: Publish Simulation Packs

on:
  push:
    tags:
      - 'allbot-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-packs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Extract version
      id: version
      env:
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: |
        VERSION="${GITHUB_REF_NAME#allbot-v}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Collect pack files
      run: |
        mkdir -p ./pack-artifacts
        cp src/Mostlylucid.BotDetection/SimulationPacks/Packs/*.yaml ./pack-artifacts/
        echo "Pack files to publish:"
        ls -la ./pack-artifacts/

    - name: Create GitHub Release with pack assets
      uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
      with:
        files: ./pack-artifacts/*.yaml
        make_latest: true
        fail_on_unmatched_files: false
