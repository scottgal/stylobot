name: Publish Simulation Packs

on:
  push:
    tags:
      - 'allbot-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-packs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Extract version
      id: version
      env:
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: |
        VERSION="${GITHUB_REF_NAME#allbot-v}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Collect pack files
      run: |
        mkdir -p ./pack-artifacts
        cp src/Mostlylucid.BotDetection/SimulationPacks/Packs/*.yaml ./pack-artifacts/
        echo "Pack files to publish:"
        ls -la ./pack-artifacts/

    - name: Upload packs as workflow artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: simulation-packs-${{ steps.version.outputs.VERSION }}
        path: ./pack-artifacts/*.yaml
        retention-days: 90
