name: Publish Mostlylucid.BotDetection

on:
  push:
    tags:
      # Per-package tag only. The combined allbot-v* tag is handled by
      # publish-all.yml's publish-botdetection job - having both fire double-publishes
      # AND trips NuGet's trusted-publisher policy.
      - 'botdetection-v*.*.*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'

    - name: Extract version and create MinVer tag
      id: get_version
      run: |
        # Handle both botdetection-v* and allbot-v* tags
        TAG=${GITHUB_REF#refs/tags/}
        if [[ "$TAG" == botdetection-v* ]]; then
          VERSION=${TAG#botdetection-v}
        else
          VERSION=${TAG#allbot-v}
          # Create a local tag that MinVer will recognize
          git tag "botdetection-v${VERSION}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Publishing version: $VERSION"

    - name: Restore dependencies
      run: |
        dotnet restore src/Mostlylucid.BotDetection/Mostlylucid.BotDetection.csproj
        dotnet restore src/Mostlylucid.BotDetection.Test/Mostlylucid.BotDetection.Test.csproj
        dotnet restore src/Mostlylucid.BotDetection.Orchestration.Tests/Mostlylucid.BotDetection.Orchestration.Tests.csproj

    - name: Build
      run: dotnet build src/Mostlylucid.BotDetection/Mostlylucid.BotDetection.csproj --configuration Release --no-restore

    - name: Run unit tests (excluding integration tests)
      run: |
        dotnet test src/Mostlylucid.BotDetection.Test/Mostlylucid.BotDetection.Test.csproj \
          --configuration Release \
          --verbosity normal \
          --filter "Category!=Integration"
        dotnet test src/Mostlylucid.BotDetection.Orchestration.Tests/Mostlylucid.BotDetection.Orchestration.Tests.csproj \
          --configuration Release \
          --verbosity normal \
          --filter "Category!=Integration"

    - name: Pack
      run: dotnet pack src/Mostlylucid.BotDetection/Mostlylucid.BotDetection.csproj --configuration Release --no-build --output ./artifacts

    - name: Login to NuGet (OIDC)
      id: nuget_login
      uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544 # v1
      with:
        user: 'mostlylucid'

    - name: Publish to NuGet (Trusted Publisher)
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: nuget-package-botdetection
        path: ./artifacts/*.nupkg

  # Also publish BotDetection.UI (same trusted workflow, same MinVer tag)
  publish-ui:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'

    - name: Create MinVer tag from allbot tag
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        if [[ "$TAG" == allbot-v* ]]; then
          VERSION=${TAG#allbot-v}
          git tag "botdetection-v${VERSION}"
        fi

    # UI + the two packages it DEPENDS ON. OpenApi and PrometheusPack were never
    # packed or pushed by any workflow (2026-08-20), while the published UI nuspec
    # declares hard dependencies on both at the same version — so every release
    # shipped a UI package with dangling dependencies and
    #   dotnet add package mostlylucid.botdetection.ui
    # failed for every customer with NU1101 on both ids. Confirmed live against
    # nuget.org on 2026-08-20; adding them here and verifying a local restore then
    # succeeded end-to-end. They pack into the SAME artifacts-ui folder so the
    # existing push step publishes all three together — MinVer gives them the same
    # version as UI from the shared botdetection-v tag, which is exactly what the
    # dependency constraint requires.
    - name: Restore, Build, Pack UI (+ its OpenApi/Prometheus dependencies)
      run: |
        for proj in \
          src/Mostlylucid.BotDetection.OpenApi/Mostlylucid.BotDetection.OpenApi.csproj \
          src/Mostlylucid.BotDetection.PrometheusPack/Mostlylucid.BotDetection.PrometheusPack.csproj \
          src/Mostlylucid.BotDetection.UI/Mostlylucid.BotDetection.UI.csproj
        do
          dotnet restore "$proj"
          dotnet build   "$proj" -c Release --no-restore
          dotnet pack    "$proj" -c Release --no-build -o ./artifacts-ui
        done

    - name: Login to NuGet (OIDC)
      id: nuget_login
      uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544 # v1
      with:
        user: 'mostlylucid'

    - name: Push UI to NuGet
      env:
        NUGET_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push ./artifacts-ui/*.nupkg --api-key "$NUGET_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
