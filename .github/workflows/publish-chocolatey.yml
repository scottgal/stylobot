name: Publish to Chocolatey

on:
  # Runs after "Publish Stylobot Binaries" finishes, so the GitHub Release and its
  # assets (SHA256SUMS.txt + signed .zips) already exist. NOT release:published --
  # GitHub suppresses that event for releases created by the Actions GITHUB_TOKEN,
  # so the old trigger never auto-fired (Chocolatey only ever ran via manual dispatch).
  workflow_run:
    workflows: ["Publish Stylobot Binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 8.1.5)'
        required: false

jobs:
  publish:
    # Auto-publish after a successful binaries build on an allbot-v* tag; skip
    # prereleases (alpha/beta). Manual workflow_dispatch always allowed.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'allbot-v') &&
       !contains(github.event.workflow_run.head_branch, '-alpha') &&
       !contains(github.event.workflow_run.head_branch, '-dev') &&
       !contains(github.event.workflow_run.head_branch, '-beta'))
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Find version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      shell: bash
      run: |
        if [ -n "$INPUT_VERSION" ]; then
          VERSION="$INPUT_VERSION"
        elif [ -n "$RUN_HEAD_BRANCH" ]; then
          # workflow_run.head_branch holds the tag name for a tag-triggered upstream run
          VERSION="${RUN_HEAD_BRANCH#allbot-v}"
        else
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isPrerelease \
            | jq -r '[.[] | select(.tagName | startswith("allbot-v")) | select(.isPrerelease == false)][0].tagName')
          VERSION="${TAG#allbot-v}"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Publishing Chocolatey package v$VERSION"

    - name: Download SHA256SUMS
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}
      shell: bash
      run: |
        gh release download "allbot-v${VERSION}" \
          --repo "$GITHUB_REPOSITORY" \
          --pattern "SHA256SUMS.txt"

    - name: Update version and checksums
      env:
        VERSION: ${{ steps.version.outputs.version }}
      shell: pwsh
      run: |
        $x64Line   = Get-Content SHA256SUMS.txt | Select-String 'stylobot-win-x64.zip'
        $arm64Line = Get-Content SHA256SUMS.txt | Select-String 'stylobot-win-arm64.zip'
        if (-not $x64Line)   { throw "x64 checksum not in SHA256SUMS.txt" }
        if (-not $arm64Line) { throw "arm64 checksum not in SHA256SUMS.txt" }
        $x64Sha   = $x64Line.ToString().Split(' ')[0]
        $arm64Sha = $arm64Line.ToString().Split(' ')[0]
        Write-Host "x64:   $x64Sha"
        Write-Host "arm64: $arm64Sha"

        $nuspec = Get-Content scripts/chocolatey/stylobot.nuspec -Raw
        $nuspec = $nuspec -replace '<version>.*</version>', "<version>$env:VERSION</version>"
        Set-Content scripts/chocolatey/stylobot.nuspec $nuspec

        $install = Get-Content scripts/chocolatey/tools/chocolateyInstall.ps1 -Raw
        $install = $install -replace 'X64_CHECKSUM_PLACEHOLDER',   $x64Sha
        $install = $install -replace 'ARM64_CHECKSUM_PLACEHOLDER', $arm64Sha
        Set-Content scripts/chocolatey/tools/chocolateyInstall.ps1 $install

    - name: Pack
      shell: pwsh
      run: |
        cd scripts/chocolatey
        choco pack stylobot.nuspec
        Get-ChildItem *.nupkg

    - name: Push
      env:
        VERSION: ${{ steps.version.outputs.version }}
        CHOCO_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      shell: pwsh
      run: |
        if (-not $env:CHOCO_API_KEY) {
          Write-Host "CHOCOLATEY_API_KEY not set, skipping"
          exit 0
        }
        cd scripts/chocolatey
        choco push "stylobot.$env:VERSION.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
