name: Publish to winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 5.6.9)'
        required: false

jobs:
  publish:
    # Only run on console-v* releases, skip prereleases (betas don't go to winget)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'console-v') &&
       github.event.release.prerelease == false)
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Find version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      shell: bash
      run: |
        if [ -n "$INPUT_VERSION" ]; then
          VERSION="$INPUT_VERSION"
        elif [ -n "$RELEASE_TAG" ]; then
          VERSION="${RELEASE_TAG#console-v}"
        else
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isPrerelease \
            | jq -r '[.[] | select(.tagName | startswith("console-v")) | select(.isPrerelease == false)][0].tagName')
          VERSION="${TAG#console-v}"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Publishing winget package v$VERSION"

    - name: Download SHA256SUMS
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}
      shell: bash
      run: |
        gh release download "console-v${VERSION}" \
          --repo "$GITHUB_REPOSITORY" \
          --pattern "SHA256SUMS.txt"
        cat SHA256SUMS.txt

    - name: Extract checksums
      id: checksums
      shell: bash
      run: |
        SHA_WIN_X64=$(grep 'stylobot-win-x64.zip' SHA256SUMS.txt | awk '{print $1}')
        SHA_WIN_ARM64=$(grep 'stylobot-win-arm64.zip' SHA256SUMS.txt | awk '{print $1}')
        echo "win_x64=$SHA_WIN_X64" >> "$GITHUB_OUTPUT"
        echo "win_arm64=$SHA_WIN_ARM64" >> "$GITHUB_OUTPUT"
        echo "Windows x64 SHA256: $SHA_WIN_X64"
        echo "Windows arm64 SHA256: $SHA_WIN_ARM64"

    - name: Install wingetcreate
      shell: pwsh
      run: |
        $url = "https://aka.ms/wingetcreate/latest"
        Invoke-WebRequest -Uri $url -OutFile wingetcreate.exe
        .\wingetcreate.exe --version

    - name: Submit to winget
      env:
        VERSION: ${{ steps.version.outputs.version }}
        SHA_WIN_X64: ${{ steps.checksums.outputs.win_x64 }}
        SHA_WIN_ARM64: ${{ steps.checksums.outputs.win_arm64 }}
        WINGET_PAT: ${{ secrets.WINGET_PAT }}
      shell: pwsh
      run: |
        if (-not $env:WINGET_PAT) {
          Write-Host "WINGET_PAT not set, skipping submission"
          exit 0
        }

        $version = $env:VERSION
        $winX64Url = "https://github.com/scottgal/stylobot/releases/download/console-v${version}/stylobot-win-x64.zip"
        $winArm64Url = "https://github.com/scottgal/stylobot/releases/download/console-v${version}/stylobot-win-arm64.zip"

        # wingetcreate update: updates an existing package manifest and opens a PR to microsoft/winget-pkgs
        # --submit: automatically create the PR (requires WINGET_PAT with repo scope on microsoft/winget-pkgs)
        .\wingetcreate.exe update Mostlylucid.StyloBot `
          --version $version `
          --urls $winX64Url $winArm64Url `
          --token $env:WINGET_PAT `
          --submit

        Write-Host ""
        Write-Host "Winget PR submitted for v$version" -ForegroundColor Green
        Write-Host "Monitor at: https://github.com/microsoft/winget-pkgs/pulls"
