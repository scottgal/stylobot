name: Publish to winget

on:
  # Runs after "Publish Stylobot Binaries" finishes, so the GitHub Release and its
  # assets (SHA256SUMS.txt + signed .zips) already exist. NOT release:published --
  # GitHub suppresses that event for releases created by the Actions GITHUB_TOKEN,
  # so the old trigger never fired (this workflow had never run).
  workflow_run:
    workflows: ["Publish Stylobot Binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 8.1.5)'
        required: false

jobs:
  publish:
    # Auto-publish after a successful binaries build on an allbot-v* tag; skip
    # prereleases (alpha/beta). Manual workflow_dispatch always allowed.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'allbot-v') &&
       !contains(github.event.workflow_run.head_branch, '-alpha') &&
       !contains(github.event.workflow_run.head_branch, '-beta'))
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Find version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      shell: bash
      run: |
        if [ -n "$INPUT_VERSION" ]; then
          VERSION="$INPUT_VERSION"
        elif [ -n "$RUN_HEAD_BRANCH" ]; then
          # workflow_run.head_branch holds the tag name for a tag-triggered upstream run
          VERSION="${RUN_HEAD_BRANCH#allbot-v}"
        else
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isPrerelease \
            | jq -r '[.[] | select(.tagName | startswith("allbot-v")) | select(.isPrerelease == false)][0].tagName')
          VERSION="${TAG#allbot-v}"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Publishing winget package v$VERSION"

    - name: Download SHA256SUMS
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}
      shell: bash
      run: |
        gh release download "allbot-v${VERSION}" \
          --repo "$GITHUB_REPOSITORY" \
          --pattern "SHA256SUMS.txt"
        cat SHA256SUMS.txt

    - name: Extract checksums
      id: checksums
      shell: bash
      run: |
        SHA_WIN_X64=$(grep 'stylobot-win-x64.zip' SHA256SUMS.txt | awk '{print $1}')
        SHA_WIN_ARM64=$(grep 'stylobot-win-arm64.zip' SHA256SUMS.txt | awk '{print $1}')
        echo "win_x64=$SHA_WIN_X64" >> "$GITHUB_OUTPUT"
        echo "win_arm64=$SHA_WIN_ARM64" >> "$GITHUB_OUTPUT"
        echo "Windows x64 SHA256: $SHA_WIN_X64"
        echo "Windows arm64 SHA256: $SHA_WIN_ARM64"

    - name: Install wingetcreate
      shell: pwsh
      run: |
        $url = "https://aka.ms/wingetcreate/latest"
        Invoke-WebRequest -Uri $url -OutFile wingetcreate.exe
        .\wingetcreate.exe --version

    - name: Submit to winget
      env:
        VERSION: ${{ steps.version.outputs.version }}
        SHA_WIN_X64: ${{ steps.checksums.outputs.win_x64 }}
        SHA_WIN_ARM64: ${{ steps.checksums.outputs.win_arm64 }}
        WINGET_PAT: ${{ secrets.WINGET_PAT }}
      shell: pwsh
      run: |
        if (-not $env:WINGET_PAT) {
          Write-Host "WINGET_PAT not set, skipping submission"
          exit 0
        }

        $version = $env:VERSION
        $winX64Url = "https://github.com/scottgal/stylobot/releases/download/allbot-v${version}/stylobot-win-x64.zip"
        $winArm64Url = "https://github.com/scottgal/stylobot/releases/download/allbot-v${version}/stylobot-win-arm64.zip"

        .\wingetcreate.exe update Mostlylucid.StyloBot `
          --version $version `
          --urls $winX64Url $winArm64Url `
          --token $env:WINGET_PAT `
          --submit

        Write-Host "Winget PR submitted for v$version"
        Write-Host "Monitor at: https://github.com/microsoft/winget-pkgs/pulls"
