# Postgres overlay for the SBC benchmark stack — TimescaleDB, same pattern as
# the FOSS dev-gateway compose. Adds a timescaledb service and points the
# gateway's dashboard/stores at it. SQLite mode = just the base compose.
#
#   docker compose -f docker-compose.sbc.yml -f docker-compose.sbc.postgres.yml up -d
services:
  gateway:
    environment:
      - StyloBotDashboard__PostgreSQL__ConnectionString=Host=timescaledb;Database=stylobot;Username=stylobot;Password=${PG_PASSWORD:-bench-password}
      - StyloBotDashboard__PostgreSQL__EnableTimescaleDB=true
      - StyloBotDashboard__PostgreSQL__AutoInitializeSchema=true
    depends_on:
      timescaledb:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: stylobot-sbc-timescaledb
    environment:
      - POSTGRES_DB=stylobot
      - POSTGRES_USER=stylobot
      - POSTGRES_PASSWORD=${PG_PASSWORD:-bench-password}
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - sbc-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylobot -d stylobot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  sbc-pg-data:
