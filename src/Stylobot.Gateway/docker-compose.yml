# Docker Compose examples for Stylobot.Gateway
# Usage: docker-compose --profile simple up -d
#
# IMPORTANT: Create a .env file with required secrets before starting:
#   ADMIN_SECRET=your-secure-admin-secret
#   POSTGRES_PASSWORD=your-secure-db-password
#   SA_PASSWORD=YourStrong@Passw0rd

services:
  # Example 1: Zero-config mode (default upstream)
  gateway-simple:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DEFAULT_UPSTREAM=http://backend:3000
    profiles:
      - simple

  # Example 2: File-based configuration
  gateway-files:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - ADMIN_SECRET=${ADMIN_SECRET:?Set ADMIN_SECRET in .env}
    profiles:
      - files

  # Example 3: Full stack with Postgres
  gateway-postgres:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DB_PROVIDER=postgres
      - DB_CONNECTION_STRING=Host=postgres;Database=gateway;Username=gateway;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - ADMIN_SECRET=${ADMIN_SECRET:?Set ADMIN_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=gateway
      - POSTGRES_USER=gateway
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  # Example 4: Full stack with SQL Server
  gateway-sqlserver:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DB_PROVIDER=sqlserver
      - DB_CONNECTION_STRING=Server=sqlserver;Database=gateway;User Id=sa;Password=${SA_PASSWORD:?Set SA_PASSWORD in .env};TrustServerCertificate=true
      - ADMIN_SECRET=${ADMIN_SECRET:?Set ADMIN_SECRET in .env}
    depends_on:
      sqlserver:
        condition: service_healthy
    profiles:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:?Set SA_PASSWORD in .env}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$SA_PASSWORD\" -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - sqlserver

  # Example 5: HTTPS with cert-from-file (PFX)
  # Useful when you already have a certificate from certbot, ZeroSSL, etc.
  # Map port 443 → container 8443 (container runs non-root, can't bind < 1024 directly).
  gateway-tls-pfx:
    build: .
    ports:
      - "8080:8080"
      - "443:8443"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./certs:/app/certs:ro    # mount cert directory
    environment:
      - DEFAULT_UPSTREAM=http://backend:3000
      - GATEWAY_HTTPS_PORT=8443
      - GATEWAY_HTTPS_CERT_PATH=/app/certs/cert.pfx
      - GATEWAY_HTTPS_CERT_PASSWORD=${TLS_CERT_PASSWORD}
    profiles:
      - tls-pfx

  # Example 6: HTTPS with PEM pair (e.g. certbot output)
  gateway-tls-pem:
    build: .
    ports:
      - "8080:8080"
      - "443:8443"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - /etc/letsencrypt/live/mysite.com:/app/certs:ro   # certbot output
    environment:
      - DEFAULT_UPSTREAM=http://backend:3000
      - GATEWAY_HTTPS_PORT=8443
      - GATEWAY_HTTPS_CERT_PATH=/app/certs/fullchain.pem
      - GATEWAY_HTTPS_CERT_KEY_PATH=/app/certs/privkey.pem
    profiles:
      - tls-pem

  # Example 7: HTTPS with automatic Let's Encrypt (ACME)
  # The gateway obtains and renews certificates automatically.
  # Port 8443 must be reachable from the internet as port 443 for ACME TLS-ALPN-01 challenge.
  gateway-tls-acme:
    build: .
    ports:
      - "8080:8080"
      - "443:8443"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data        # certs stored in /app/data/certs by default
    environment:
      - DEFAULT_UPSTREAM=http://backend:3000
      - GATEWAY_HTTPS_PORT=8443
      - GATEWAY_HTTPS_DOMAIN=mysite.com
      - GATEWAY_HTTPS_ACME_EMAIL=admin@mysite.com
    profiles:
      - tls-acme

volumes:
  postgres_data:
  sqlserver_data:
