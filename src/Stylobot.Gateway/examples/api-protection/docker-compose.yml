# StyloBot Gateway — API Service Protection
# Protects REST APIs from credential stuffing, scraping, and abuse.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d

services:
  gateway:
    image: scottgal/stylobot-gateway:latest
    ports:
      - "80:8080"
    environment:
      - ADMIN_SECRET=${ADMIN_SECRET:?Set ADMIN_SECRET in .env}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  # Replace with your actual API service
  api:
    image: nginx:alpine
    volumes:
      - ./api-stub.conf:/etc/nginx/conf.d/default.conf:ro
