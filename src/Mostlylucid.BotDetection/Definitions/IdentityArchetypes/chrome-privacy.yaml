description: Chromium-family on desktop with a privacy extension (Privacy Badger, DuckDuckGo, Ghostery) that adds Sec-GPC or DNT. Same header shape as vanilla Chrome plus the explicit privacy signal -- bots do not volunteer Sec-GPC.
