archetype_id: firefox-desktop
name: Firefox Desktop
description: Mozilla Firefox on a desktop OS. Asserts only the browser-identity-defining slots (UA family, Accept, Accept-Encoding). Sec-Fetch-* and Upgrade-Insecure-Requests are navigation-volatile (Firefox omits Sec-Fetch-User on programmatic and initial loads; UIR is top-level-only by spec) so the archetype stays silent on them rather than mis-classifying a real Firefox sub-resource or XHR as another browser family.
archetype_kind: human-browser
