    bot_name: Mbin
    bot_type: SocialMediaBot
    vendor: Mbin

  - pattern: kbin
    bot_name: Kbin
    bot_type: SocialMediaBot
    vendor: kbin

  - pattern: Snac
    bot_name: Snac
