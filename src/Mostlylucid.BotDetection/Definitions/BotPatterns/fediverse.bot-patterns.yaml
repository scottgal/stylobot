category: fediverse
description: "Fediverse and ActivityPub decentralised social platform bots. Cannot be verified by IP range (any cloud IP). UA contains platform name and instance domain (e.g. Mastodon/4.2.0 (compatible; +https://mastodon.social/)). Pattern match alone is reliable enough for identification."
patterns:
  - pattern: Mastodon
    bot_name: Mastodon
    bot_type: SocialMediaBot
    vendor: Mastodon

  - pattern: Pleroma
    bot_name: Pleroma
    bot_type: SocialMediaBot
    vendor: Pleroma

  - pattern: Misskey
    bot_name: Misskey
    bot_type: SocialMediaBot
    vendor: Misskey

  - pattern: Calckey
    bot_name: Calckey
    bot_type: SocialMediaBot
    vendor: Calckey

  - pattern: Akkoma
    bot_name: Akkoma
    bot_type: SocialMediaBot
    vendor: Akkoma

  - pattern: Pixelfed
    bot_name: Pixelfed
    bot_type: SocialMediaBot
    vendor: Pixelfed

  - pattern: Lemmy
    bot_name: Lemmy
    bot_type: SocialMediaBot
    vendor: Lemmy

  - pattern: Friendica
    bot_name: Friendica
    bot_type: SocialMediaBot
    vendor: Friendica

  - pattern: Hubzilla
    bot_name: Hubzilla
    bot_type: SocialMediaBot
    vendor: Hubzilla

  - pattern: PeerTube
    bot_name: PeerTube
    bot_type: SocialMediaBot
    vendor: Framasoft

  # Live trigger (Iceshrimp): sig dE6rEAecvb3KKRsfUGui5w on www.stylobot.net
  # was a legitimate Iceshrimp NodeInfo fetch from a Hetzner instance host
  # (162.55.240.x). The catalog was missing Iceshrimp so the friendly-pin
  # gate exited "not-applicable:yamlType=null" and the reputation cache
  # latched ConfirmedBad on the first visit -- next visit got Silent Throttle
  # despite being legitimate fediverse traffic.
  - pattern: Iceshrimp
    bot_name: Iceshrimp
    bot_type: SocialMediaBot
    vendor: Iceshrimp

  - pattern: Sharkey
    bot_name: Sharkey
    bot_type: SocialMediaBot
    vendor: Sharkey

  - pattern: Firefish
    bot_name: Firefish
    bot_type: SocialMediaBot
    vendor: Firefish

  - pattern: GoToSocial
    bot_name: GoToSocial
    bot_type: SocialMediaBot
    vendor: GoToSocial

  - pattern: Mitra
    bot_name: Mitra
    bot_type: SocialMediaBot
    vendor: Mitra

  - pattern: Bonfire
    bot_name: Bonfire
    bot_type: SocialMediaBot
    vendor: Bonfire

  # Activity poolers / search-side fediverse clients
