mode_id: signalr-negotiate
name: SignalR negotiate
description: SignalR hub handshake. POST to a path ending /hub/negotiate or /negotiate?negotiateVersion=N, same-origin XHR shape. Identifies real-time hub clients vs scripted polling.
order: 20
predicate:
  method_in: ["POST"]
  sec_fetch_pattern_in: [7]
  upgrade_insecure_requests: false
  path_matches:
    - "*/hub/negotiate*"
    - "*/negotiate*"
# Seed mirrors xhr (GET + cors) because the 3-input mode classifier
# surface cannot see path; signalr-negotiate is distinguished from xhr in
# production via the path predicate above, not via centroid coordinates.
# Once T14 folds path into the observation vector this seed will get its
# own coordinates and break the mirror.
seed:
  method: GET
  sec_fetch_mode: cors
  upgrade_websocket: false
