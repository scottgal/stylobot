mode_id: bot-raw
name: Bot raw
description: No Sec-Fetch-* headers at all. Googlebot, curl, python-requests, wget, ad-hoc HTTP libraries. Real browsers always emit at least Sec-Fetch-Dest+Mode+Site on every request, even sub-resources; the absence of every Sec-Fetch-* slot is the cleanest tell.
order: 80
predicate:
  sec_fetch_pattern_in: [0]
# Empty sec_fetch_mode is the canonical "no Sec-Fetch headers" shape; the
# encoder maps that to bitmask 0 → BitmaskScaled = -1, which is exactly
# what cosine needs to separate bot-raw from every browser-shaped mode.
seed:
  method: GET
  sec_fetch_mode: ""
  upgrade_websocket: false
