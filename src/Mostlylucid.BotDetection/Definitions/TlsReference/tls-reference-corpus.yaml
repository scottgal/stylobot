# ============================================================================
# TLS reference corpus for the StyloBot subset / version-delta JA3 checks.
# ============================================================================
#
# Two detection techniques consume this corpus:
#
# 1. "Strict subset of real Chrome" cipher blacklisting (damru pattern):
#    damru produces ~184 JA3 variants by blacklisting 1-3 ciphers from the
#    stock Chrome cipher list. Detection compares the observed JA3 STRING
#    against the canonical reference for the UA-claimed browser+version. If
#    the version / extensions / curves / formats match exactly AND the cipher
#    list is a strict subset of the reference (1-3 ciphers missing), the
#    fingerprint is flagged. See docs/architecture/fingerprint-match.md.
#
# 2. UA-vs-TLS version delta (Multilogin / Kameleo Chroma pattern):
#    Anti-detect browsers patch their underlying Chromium fork but the TLS
#    stack typically lags Chrome stable by 1-2 releases. The observed JA3
#    hash matches Chrome version N-1 while the UA claims version N. Detection
#    looks up the observed JA3 in the per-version index and compares.
#
# Schema:
#   version             schema version
#   generated_at        UTC date of last refresh
#   references:
#     <browser>:
#       <major_version>:
#         desktop / mobile:
#           ja3:           MD5 hash of ja3_string
#           ja3_string:    raw SSLVersion,Cipher,Extension,Curve,Format
#           ja4:           optional JA4 fingerprint
#           h2_settings:   optional HTTP/2 SETTINGS frame order
#           source:        citation for where this entry came from
#
# Refresh:
#   - Plan 2b ships tools/Mostlylucid.BotDetection.Tools.Ja3Corpus, a console
#     tool that captures fresh JA3s from Stylobot.Gateway's Kestrel TLS
#     metadata and re-signs the corpus for Cloudsmith distribution.
#   - Customers can enable opt-in remote refresh via
#     BotDetection:TlsCorpus:RefreshUrl + signed-update verification.
#
# CRITICAL: the entries below are illustrative starter values from public
# references. They MAY be stale relative to current Chrome stable. Real
# production deployments should enable remote refresh (Plan 2b) for current
# fingerprints. The subset check is robust to staleness (cipher additions
# in newer Chrome are non-bot); the version-delta check is more sensitive.
# ============================================================================

