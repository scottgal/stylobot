name: latency-protection
description: Activates when upstream EMA latency is elevated
enabled: true
scope: global
priority: 0

steps:
  - level: 1
    name: watch
    activate:
      condition: any
      rules:
        - signal: response.latency_ema
          above: 500
          for_seconds: 60
    policy: throttle-gentle
    deactivate:
      condition: all
      rules:
        - signal: response.latency_ema
          below: 300
          for_seconds: 120

  - level: 2
    name: protect
    activate:
      condition: any
      rules:
        - signal: response.latency_ema
          above: 2000
          for_seconds: 30
    policy: throttle-moderate
    deactivate:
      condition: all
      rules:
        - signal: response.latency_ema
          below: 800
          for_seconds: 180
