archetype_id: webhook
name: Webhook Receiver
description: >
  Inbound webhook deliveries (Stripe, GitHub, Shopify, Slack, ...). Recognized by the
  behavioral shape (POST + JSON + a webhook signature/event header) corroborated by a
  named provider, the learned dominant source IP, or a verified (2xx) track record.
  Detection always runs; a POST without corroboration is scored normally (spoof guard).
signature_headers:
  - Stripe-Signature
  - X-Hub-Signature-256
  - X-Hub-Signature
  - X-GitHub-Event
  - X-GitHub-Delivery
  - X-Shopify-Hmac-Sha256
  - X-Slack-Signature
  - X-Webhook-Signature
  - X-Event-Key
providers:
  - name: Stripe
    signature_header: Stripe-Signature
    # Stripe's published webhook-notification source IPs (https://docs.stripe.com/ips,
    # machine-readable at https://stripe.com/files/ips/ips_webhooks.txt). Corroborates a
    # Stripe-Signature delivery WITHOUT needing accumulated dominant-ip/verified-record
    # history -- the day-one/cold-start case for a brand-new webhook receiver endpoint,
    # where dominant/verified corroboration has no history to draw on yet. Stripe rotates
    # this list occasionally; re-fetch and update on a Stripe webhook-delivery incident or
    # a periodic audit (no auto-refresh service wired yet, unlike WellKnownBotIndex).
    ip_ranges:
      - 3.18.12.63/32
      - 3.130.192.231/32
      - 13.235.14.237/32
      - 13.235.122.149/32
      - 18.211.135.69/32
      - 35.154.171.200/32
      - 52.15.183.38/32
      - 54.88.130.119/32
      - 54.88.130.237/32
      - 54.187.174.169/32
      - 54.187.205.235/32
      - 54.187.216.72/32
      - 35.157.207.129/32
      - 3.69.109.8/32
      - 3.120.168.93/32
  - name: GitHub
    signature_header: X-Hub-Signature-256
    ip_ranges: []
  - name: Shopify
    signature_header: X-Shopify-Hmac-Sha256
    ip_ranges: []
  - name: Slack
    signature_header: X-Slack-Signature
    ip_ranges: []
scoring:
  corroborated_confidence_delta: -0.8
  corroborated_weight: 2.5
  dominance_min_count: 20
  dominance_min_share: 0.6
  verified_min_2xx: 10
