# Content Sequence Detector
name: ContentSequenceContributor
priority: 6
enabled: true
description: Tracks content request sequences and writes signals for deferred detection

scope:
  sink: botdetection
  coordinator: detection
  atom: sequence

taxonomy:
  kind: sequencer
  determinism: deterministic
  persistence: ephemeral

input:
  accepts:
    - type: botdetection.request
      required: true
  required_signals: []
  optional_signals:
    - detection.primary_signature
    - similarity.cluster_id

output:
  signals:
    - key: sequence.position
      entity_type: integer
    - key: sequence.on_track
      entity_type: boolean
    - key: sequence.diverged
      entity_type: boolean
    - key: sequence.divergence_score
      entity_type: number
    - key: sequence.chain_id
      entity_type: string
    - key: sequence.centroid_type
      entity_type: string
    - key: sequence.content_path
      entity_type: string
    - key: sequence.signalr_expected
      entity_type: boolean
    - key: sequence.prefetch_detected
      entity_type: boolean
    - key: sequence.cache_warm
      entity_type: boolean

triggers:
  requires: []
  skip_when: []

lane:
  name: fast
  max_concurrency: 16
  priority: 96

defaults:
  weights:
    base: 0.0
    bot_signal: 0.5
    human_signal: 0.5
    verified: 0.0
    early_exit: 0.0

  confidence:
    neutral: 0.0
    bot_detected: 0.25
    human_indicated: -0.1
    strong_signal: 0.4
    high_threshold: 0.7
    low_threshold: 0.2
    escalation_threshold: 0.0

  timing:
    timeout_ms: 5
    cache_refresh_sec: 0

  features:
    detailed_logging: false
    enable_cache: false
    can_early_exit: false
    can_escalate: false

  parameters:
    divergence_threshold: 0.6
    timing_tolerance_multiplier: 3.0
    min_centroid_sample_size: 20
    session_gap_minutes: 30
    max_tracked_positions: 20
    machine_speed_threshold_ms: 20.0
    machine_speed_score: 0.3
    high_request_count_score: 0.2
    high_request_count_threshold: 200
    request_count_idle_reset_seconds: 60

    # Per-RequestState divergence weights. Flat 0.5 was a major false-positive source.
    # Static fetches are noise (browser side-effect); auth/notfound/search are highly meaningful.
    unexpected_weight_static_asset: 0.05
    unexpected_weight_page_view: 0.10
    unexpected_weight_api_call: 0.25
    unexpected_weight_signalr: 0.20
    unexpected_weight_websocket: 0.20
    unexpected_weight_server_sent_event: 0.20
    unexpected_weight_form_submit: 0.40
    unexpected_weight_auth_attempt: 0.60
    unexpected_weight_not_found: 0.50
    unexpected_weight_search: 0.40

    # Learned-global warmup: suppress divergence until this many confirmed-human sessions exist.
    learned_global_min_sessions: 50

tags:
  - fast-path
  - sequence
  - stage-0
