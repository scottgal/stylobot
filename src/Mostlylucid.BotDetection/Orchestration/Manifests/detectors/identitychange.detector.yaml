# IdentityChange Contributor - surface-dimension shift detection on a matched
# fingerprint. Stub for the commercial API-protection feature: alerting /
# blocking on key-theft cadence shifts. FOSS writes the risk.* signals and a
# low-confidence indicator contribution; FOSS policy does not gate on the
# thresholds. Commercial layers do.
#
# Distinct from:
#   - geo.change.*       per-IP geo drift, not per-fingerprint
#   - AccountTakeover    needs authenticated user events, this works on anon FP
#   - FingerprintMatch   handles the matching itself, this annotates the result
name: IdentityChangeContributor
priority: 30  # After FingerprintMatch (6), Ip (12), UA (10), Geo (20)
enabled: true
description: Flags suspicious shifts in the surface dimensions of a matched fingerprint - geo country, ASN, UA family, and the introduction of datacenter / Tor / VPN IP space. Indicator only; commercial API-protection layers thresholds and alerting on top.

scope:
  sink: botdetection
  coordinator: detection
  atom: identitychange

taxonomy:
  kind: analyst
  determinism: deterministic
  persistence: ephemeral  # in-memory snapshot keyed on fingerprint_id (24h sliding TTL)

input:
  accepts:
    - type: botdetection.request
      required: true
      description: HTTP request post-fingerprint-match - needs identity.fingerprint_id and at least one of (geo.country_code, ip.asn, ua.family).
      signal_pattern: identity.*

  required_signals:
    - identity.fingerprint_id

  optional_signals:
    - geo.country_code
    - ip.asn
    - ua.family
    - ip.is_datacenter
    - geo.is_tor
    - geo.is_vpn
    - threatintel.tor

output:
  produces:
    - type: botdetection.contribution
      description: SurfaceDimShift contribution at low confidence when divergence detected; no contribution on stable / first-seen fingerprints.

  signals:
    # Every signal carries a verbose description - the LLM reasoning surface
    # needs to know what each flag means without parsing the .cs.
    - key: risk.country_changed
      entity_type: boolean
      salience: 0.85
      description: True when this request's geo.country_code differs from the matched fingerprint's prior observation. Large geo jumps are the canonical "credentials shared with another party" signal - a genuine visitor very rarely teleports.
    - key: risk.country_transition
      entity_type: string
      salience: 0.7
      description: Human-readable "PREV_CC -> NEW_CC" transition, written only when risk.country_changed is true. Lets logs and dashboards render the change without re-joining state.
    - key: risk.asn_changed
      entity_type: boolean
      salience: 0.7
      description: True when this request's ip.asn differs from the matched fingerprint's prior observation. Even within the same country an ASN change can indicate rotation through proxies, VPN exits, or residential-proxy services.
    - key: risk.ua_family_changed
      entity_type: boolean
      salience: 0.9
      description: True when this request's ua.family differs from the matched fingerprint's prior observation. Very rare for genuine users (people don't switch browser families per request) - common for credential theft where the new caller's UA doesn't match the original visitor's.
    - key: risk.infrastructure_introduced
      entity_type: boolean
      salience: 0.85
      description: True when this request appears from datacenter / Tor / VPN IP space but prior observations did not. Often the first observable when an API key gets exfiltrated to a botnet or scraping farm.
    - key: risk.shape_hash_changed
      entity_type: boolean
      salience: 0.95
      description: True when this request's canvas+WebGL shape hash differs from the matched fingerprint's established shape. Hardware-derived and effectively immutable for real users, so a shift under one identity is the canonical anti-detect-browser profile-swap (Multilogin Mimic / Kameleo Chroma cycling per-session canvas identities).
    - key: risk.botd_kind_changed
      entity_type: boolean
      salience: 0.7
      description: True when this request's BotD verdict (selenium / puppeteer / headless_chrome / ...) differs from the established one under the same identity - the automation framework swapped mid-identity, rare for legitimate operators.
    - key: risk.suspicious_change_score
      entity_type: number
      salience: 0.8
      description: Weighted aggregate of the above flags, clamped to [0,1]. Stays well under 1.0 even for "everything changed at once" - this is an indicator, not a verdict. FOSS does not gate policy on it directly; commercial layers thresholds and alerting on top.
    - key: risk.suspicious_change_reason
      entity_type: string
      salience: 0.75
      description: Human-readable summary of what changed - e.g. "country US -> RU; UA family Chrome -> python-requests". Empty when nothing changed; drives dashboard chips and log messages.
    - key: risk.drift_frequency_high
      entity_type: boolean
      salience: 0.8
      description: True when the matched fingerprint's DURABLE, accumulated drift-frequency EWMA is at or above drift_frequency_high_threshold. Independent of whether THIS request diverged - a fingerprint whose surface dims (geo / ASN / UA family / canvas shape / BotD verdict) change often across its lifetime is the anti-detect / profile-cycling browser signature (Multilogin Mimic / Kameleo Chroma rotating identity per session), so every request under that fingerprint is treated as suspicious. Wires the previously persisted-but-unread Fingerprint.DriftFrequency (folded at the absorption boundary) into the live per-request score.
    - key: risk.drift_frequency
      entity_type: string
      salience: 0.8
      description: The matched fingerprint's accumulated drift-frequency EWMA figure (formatted to 3 decimals), written alongside risk.drift_frequency_high so dashboards and logs can render the magnitude without re-joining fingerprint state.
    - key: risk.behavioral_drift_high
      entity_type: boolean
      salience: 0.85
      description: True when THIS request's own identity vector diverges (weighted-cosine below behavioral_drift_warning_threshold) from the matched fingerprint's established behavioural centroid. Distinct from the discrete surface-dims flags above (geo/ASN/UA/canvas) - this is the continuous behavioural/header shape, so it catches drift even when every surface dim stays put (same IP/UA/geo, different tool fingerprint - "Adblocker -> curl"). Computed inline against this request's own vector, so it feeds scoring in real time rather than only FingerprintDriftService's background audit-trail badge.
    - key: risk.behavioral_drift_score
      entity_type: string
      salience: 0.7
      description: The weighted-cosine similarity between this request's identity vector and the fingerprint's centroid (formatted to 3 decimals), written alongside risk.behavioral_drift_high.

triggers:
  requires:
    - signal: identity.fingerprint_id
      description: Runs after FingerprintMatch has resolved the request to a fingerprint

emits:
  on_complete:
    # Mirrors output.signals - verbose descriptions on both sides because
    # the LLM reasoning chain may consume either block.
    - key: risk.country_changed
      type: bool
      description: True when this request's geo.country_code differs from the matched fingerprint's prior observation - "credentials are being used from somewhere new" signal.
    - key: risk.country_transition
      type: string
      description: PREV_CC -> NEW_CC formatted transition when country changed - render-ready.
    - key: risk.asn_changed
      type: bool
      description: True when this request's ip.asn differs from the matched fingerprint's prior observation - rotation-through-proxies signal.
    - key: risk.ua_family_changed
      type: bool
      description: True when this request's ua.family differs from the matched fingerprint's prior observation - very strong "different caller using the same identity" signal.
    - key: risk.infrastructure_introduced
      type: bool
      description: True when this request appears from datacenter / Tor / VPN but prior observations did not - infrastructure shift on the same identity.
    - key: risk.shape_hash_changed
      type: bool
      description: True when this request's canvas+WebGL shape hash differs from the established shape - anti-detect-browser profile-swap signal.
    - key: risk.botd_kind_changed
      type: bool
      description: True when this request's BotD verdict differs from the established one - automation framework swapped under the same identity.
    - key: risk.suspicious_change_score
      type: double
      description: Weighted aggregate of the above flags in [0,1] - indicator only.
    - key: risk.suspicious_change_reason
      type: string
      description: Human-readable summary of what changed; empty when nothing changed.
    - key: risk.drift_frequency_high
      type: bool
      description: True when the matched fingerprint's accumulated drift-frequency EWMA is at or above drift_frequency_high_threshold - the anti-detect / profile-cycling signature, independent of whether THIS request diverged.
    - key: risk.drift_frequency
      type: string
      description: The matched fingerprint's accumulated drift-frequency EWMA figure (3 decimals) - render-ready alongside risk.drift_frequency_high.
    - key: risk.behavioral_drift_high
      type: bool
      description: True when this request's own identity vector diverges from the fingerprint's established behavioural centroid (weighted-cosine below threshold) - catches shape drift even when discrete surface dims (geo/ASN/UA/canvas) stay put.
    - key: risk.behavioral_drift_score
      type: string
      description: Weighted-cosine similarity between this request's vector and the fingerprint's centroid (3 decimals) - render-ready alongside risk.behavioral_drift_high.

  on_failure:
    - detector.identitychange.failed

defaults:
  weights:
    base: 1.0
    bot_signal: 0.5    # indicator only, half the standard bot weight
    human_signal: 0.0  # this contributor never emits human signal

  parameters:
    # Per-flag contribution to risk.suspicious_change_score (summed, clamped to 1.0).
    # Calibration intent: UA family change is the loudest single signal (a different
    # browser family on the same identity is almost never legitimate); country and
    # infra introduction tie for second; ASN alone is the weakest because legitimate
    # mobile-to-wifi handover changes ASN constantly.
    country_change_weight: 0.35
    asn_change_weight: 0.20
    ua_family_change_weight: 0.30
    infra_introduced_weight: 0.25
    # Shape hash (canvas + WebGL triple) drift. Highest single-dim weight because
    # the value is hardware-derived and effectively immutable for real users; a
    # shift under the same fingerprint id is the canonical anti-detect-browser
    # profile-swap pattern (Multilogin Mimic / Kameleo Chroma cycle profiles per
    # session, each profile owns a distinct canvas+WebGL identity).
    shape_hash_change_weight: 0.40
    # BotD verdict drift (automation framework swapped under the same identity).
    # Medium weight: legitimate operators rarely swap BotD-flagged frameworks
    # mid-session, but BotD does have non-trivial false-positive rates so the
    # signal alone shouldn't tip policy.
    botd_kind_change_weight: 0.20
    # Confidence scalar for the indicator contribution - final confidence is
    # contribution_confidence * suspicious_change_score, so even "everything
    # changed" caps the contribution at 0.2. FOSS deliberately does not block
    # on this; commercial policy can override.
    contribution_confidence: 0.2
    # Accumulated durable drift frequency (#16 wired as a live per-request input).
    # Fingerprint.DriftFrequency is an EWMA (bumped at the absorption boundary on
    # every real surface-dim change) of HOW OFTEN this fingerprint drifts over its
    # lifetime. At/above the threshold the fingerprint is treated as a frequently-
    # drifting anti-detect / profile-cycling browser and its current request scores
    # suspicious even when THIS request did not itself diverge. The drift-frequency
    # contribution's confidence is drift_frequency_weight * frequency, clamped to
    # [0, drift_frequency_weight]. Indicator only; FOSS does not gate policy on it.
    drift_frequency_high_threshold: 0.3
    drift_frequency_weight: 0.3
    # Behavioural shape drift (LIVE, per-request): weighted-cosine between this request's
    # own identity vector (IdentityVectorAtom's per-request compose, not the historical
    # "latest observation" FingerprintDriftService's Tick10s audit pass uses) and the
    # fingerprint's established centroid+weights. 0.92 mirrors DriftWarningThreshold's
    # default (identity.drift options) but is kept as an independent atom-owned parameter
    # so live scoring and the background badge can be tuned separately. Gated on
    # CentroidMaturity > 0 so a cold-start (all-zero) centroid never false-positives.
    behavioral_drift_warning_threshold: 0.92
    behavioral_drift_weight: 0.3

tags:
  - identity
  - risk
  - api-key-theft-detection
  - commercial-stub
