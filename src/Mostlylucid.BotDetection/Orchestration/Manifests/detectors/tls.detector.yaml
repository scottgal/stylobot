# TLS Fingerprint Detector - JA3/JA4 TLS handshake analysis
name: TlsFingerprintContributor
priority: 11  # Runs early with other stage-0 detectors
enabled: true
description: Analyzes TLS fingerprints (JA3/JA4) to detect automated clients

scope:
  sink: botdetection
  coordinator: detection
  atom: tlsfingerprint

taxonomy:
  kind: sensor
  determinism: deterministic
  persistence: ephemeral

# Input contract - what this detector consumes
input:
  accepts:
    - type: botdetection.request
      required: true
      description: HTTP request with TLS context
      signal_pattern: request.tls.*

  required_signals: []  # TLS data may not be available

  optional_signals:
    - request.tls.protocol
    - request.tls.cipher
    - request.headers.x-ja3-hash
    - request.headers.x-tls-protocol

# Output contract - what this detector produces
output:
  produces:
    - type: botdetection.contribution
      description: TLS analysis contribution to detection ledger
    - type: botdetection.tls_signal
      description: Detailed TLS fingerprint signals

  signals:
    - key: tls.available
      entity_type: boolean
      salience: 0.3
      description: TLS detail was available for this request (some hops strip it)
    - key: tls.is_https
      entity_type: boolean
      salience: 0.4
      description: Request was over HTTPS
    - key: tls.behind_proxy
      entity_type: boolean
      salience: 0.2
      description: TLS detail came via proxy headers (e.g. X-JA3-Hash)
    - key: tls.ja3_hash
      entity_type: string
      salience: 0.9
      description: JA3 fingerprint hash
    - key: tls.ja3_string
      entity_type: string
      salience: 0.6
      description: JA3 fingerprint string (pre-hash form)
    - key: tls.cipher_suite
      entity_type: string
      salience: 0.7
      description: Negotiated TLS cipher suite
    - key: tls.fingerprint_known
      entity_type: boolean
      salience: 0.95
      description: JA3/JA4 matches a known browser or bot fingerprint
    - key: tls.client_cert_present
      entity_type: boolean
      salience: 0.6
      description: Client presented a TLS certificate (rare for browsers)
    - key: tls.client_cert_issuer
      entity_type: string
      salience: 0.5
      description: Issuer DN of the presented client certificate
    - key: tls.error
      entity_type: string
      salience: 0.3
      description: Parser / availability error message when TLS info couldn't be read
    - key: user_agent.tls_protocol
      entity_type: string
      salience: 0.5
      description: TLS protocol version negotiated for this request (SignalKeys.TlsProtocol)

triggers:
  requires: []  # No dependencies - runs first wave
  skip_when:
    - detection.early_exit

emits:
  on_start:
    - detector.tls.started

  on_complete:
    # Signal keys here MUST match the strings written via state.WriteSignal in
    # TlsFingerprintContributor.cs - the manifest is the source of truth for
    # tooling (--output-config, dashboard "what signals does this detector emit",
    # benchmark scenario filters). Drift between this list and the .cs writes
    # means tooling silently shows the wrong surface.
    - key: tls.available
      type: bool
      description: TLS detail was available for this request
    - key: tls.is_https
      type: bool
      description: Connection uses HTTPS
    - key: tls.behind_proxy
      type: bool
      description: TLS detail came via proxy headers
    - key: tls.ja3_hash
      type: string
      description: JA3 fingerprint hash
    - key: tls.ja3_string
      type: string
      description: JA3 fingerprint string (pre-hash)
    - key: tls.cipher_suite
      type: string
      description: Negotiated TLS cipher suite
    - key: tls.fingerprint_known
      type: bool
      description: JA3/JA4 matches a known browser or bot fingerprint
    - key: tls.client_cert_present
      type: bool
      description: Client presented a TLS certificate
    - key: tls.client_cert_issuer
      type: string
      description: Issuer DN of the presented client certificate
    - key: tls.error
      type: string
      description: Parser error message when TLS info couldn't be read
    - key: user_agent.tls_protocol
      type: string
      description: TLS protocol version (SignalKeys.TlsProtocol)
    - key: transport.spoofed_edge_headers
      type: bool
      description: Untrusted peer sent edge fingerprint headers (possible spoof)

  on_failure:
    - detector.tls.failed

listens:
  required: []
  optional: []

lane:
  name: fast
  max_concurrency: 8
  priority: 100

# ============================================
# DEFAULT CONFIGURATION - NO MAGIC NUMBERS
# Override via appsettings.json: BotDetection:Detectors:TlsFingerprintContributor:*
# ============================================
defaults:
  weights:
    base: 1.0           # Base contribution weight
    bot_signal: 1.8     # Strong signal - TLS fingerprints are reliable
    human_signal: 1.5   # Weight for known browser fingerprints
    verified: 2.0       # Weight for known bad fingerprints
    early_exit: 0.0     # Does not trigger early exit alone

  confidence:
    neutral: 0.0        # TLS appears normal
    bot_detected: 0.4   # Bot-like TLS fingerprint
    human_indicated: -0.30  # Known browser fingerprint (strong human signal)
    strong_signal: 0.85 # Known bot fingerprint match
    high_threshold: 0.8 # Threshold for "definitely bot"
    low_threshold: 0.2  # Threshold for "definitely browser"
    escalation_threshold: 0.5

  timing:
    timeout_ms: 30      # Very fast - just header parsing
    cache_refresh_sec: 0  # No caching needed

  features:
    detailed_logging: false
    enable_cache: false
    can_early_exit: false
    can_escalate: false

  # TLS-specific parameters
  parameters:
    # HTTP indicator (not HTTPS)
    http_confidence_penalty: 0.05
    # Known fingerprint detection
    known_bot_fingerprint_confidence: 0.85
    known_browser_fingerprint_confidence: -0.15
    # Old TLS protocol penalties
    outdated_ssl_penalty: 0.7
    old_tls_penalty: 0.2
    tls_version_penalties:
      SSLv3: 0.7
      TLSv1.0: 0.3
      TLSv1.1: 0.2
      TLSv1.2: 0.0
      TLSv1.3: -0.05
    # Weak cipher penalty
    weak_cipher_penalty: 0.4
    # Client cert present (uncommon for browsers)
    client_cert_penalty: 0.3
    # Cipher-list subset detection (damru pattern): the observed JA3 string
    # has the same TLS version + extensions + curves + formats as the canonical
    # Chrome reference for the UA-claimed version, but the cipher list is a
    # strict subset with 1..cipher_subset_max_missing ciphers removed.
    cipher_subset_max_missing: 4
    cipher_subset_confidence: 0.85
    cipher_subset_weight: 1.5
    # UA-vs-TLS version delta (Multilogin / Kameleo Chroma pattern): the
    # observed JA3 hash maps to a Chrome version >= version_delta_min_delta
    # releases behind what the UA claims. Patched Chromium forks lag stable.
    version_delta_min_delta: 2
    version_delta_confidence: 0.55
    version_delta_weight: 1.1
    # Headers to check for JA3 data (from reverse proxy)
    ja3_headers:
      - "X-JA3-Hash"
      - "X-JA3-String"
      - "X-TLS-Protocol"
      - "X-TLS-Cipher"
    # Spoofed edge-header detection
    spoofed_edge_headers_confidence: 0.3
    spoofed_edge_headers_weight: 1.2

tags:
  - fast-path
  - fingerprinting
  - tls
  - stage-0
