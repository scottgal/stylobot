# HTTP/2 Fingerprint Detector - AKAMAI-style HTTP/2 fingerprinting
name: Http2FingerprintContributor
priority: 13  # Runs early with other stage-0 detectors
enabled: true
description: Analyzes HTTP/2 settings frames, priorities, and HPACK patterns for automation detection

scope:
  sink: botdetection
  coordinator: detection
  atom: http2

taxonomy:
  kind: sensor
  determinism: deterministic
  persistence: ephemeral

# Input contract - what this detector consumes
input:
  accepts:
    - type: botdetection.request
      required: true
      description: HTTP request with HTTP/2 context
      signal_pattern: request.http2.*

  required_signals: []  # HTTP/2 data may not be available

  optional_signals:
    - request.http2.settings
    - request.http2.priority
    - request.headers.x-http2-fingerprint

# Output contract - what this detector produces
output:
  produces:
    - type: botdetection.contribution
      description: HTTP/2 fingerprint analysis contribution

  signals:
    # Signal keys here MUST match the strings written via state.WriteSignal in
    # Http2FingerprintContributor.cs - the namespace is `h2.*`, not `detection.http2.*`.
    - key: h2.is_http2
      entity_type: boolean
      salience: 0.6
      description: Connection uses HTTP/2
    - key: h2.is_http3
      entity_type: boolean
      salience: 0.6
      description: Connection uses HTTP/3 (set by this contributor for cross-pivot)
    - key: h2.behind_proxy
      entity_type: boolean
      salience: 0.3
      description: HTTP/2 framing info came from a downstream proxy rather than the wire
    - key: h2.settings_fingerprint
      type: string
      salience: 0.9
      description: HTTP/2 SETTINGS frame fingerprint
    - key: h2.pseudoheader_order
      entity_type: string
      salience: 0.8
      description: Order of pseudo-headers (:method :authority :path :scheme)
    - key: h2.stream_priority
      entity_type: string
      salience: 0.6
      description: Stream priority pattern
    - key: h2.uses_priority
      entity_type: boolean
      salience: 0.5
      description: Client emitted PRIORITY frames
    - key: h2.window_update_pattern
      entity_type: string
      salience: 0.4
      description: WINDOW_UPDATE frame cadence pattern
    - key: h2.window_update_count
      entity_type: number
      salience: 0.3
      description: Number of WINDOW_UPDATE frames observed
    - key: h2.push_enabled
      entity_type: boolean
      salience: 0.4
      description: Client accepted server-push frames
    - key: h2.preface_valid
      entity_type: boolean
      salience: 0.5
      description: HTTP/2 connection preface matched RFC 7540
    - key: h2.population_http2_rate
      entity_type: number
      salience: 0.3
      description: Rolling % of HTTP/2 requests this fingerprint has produced
    - key: h2.population_samples
      entity_type: number
      salience: 0.2
      description: Sample count behind the population rate
    - key: h2.fingerprint_unknown
      entity_type: boolean
      salience: 0.6
      description: Settings fingerprint doesn't match any known browser / bot
    - key: h2.analysis_error
      entity_type: string
      salience: 0.2
      description: Parser error

triggers:
  requires: []  # No dependencies - runs first wave
  skip_when:
    - detection.early_exit

emits:
  on_start:
    - detector.http2.started

  on_complete:
    # Signal keys MUST match the strings written via state.WriteSignal in
    # Http2FingerprintContributor.cs (namespace `h2.*`). Descriptions are the
    # LLM reasoning surface - every signal carries its own so an LLM can
    # explain what a flagged request looked like without parsing the .cs.
    - key: h2.is_http2
      type: bool
      description: Connection uses HTTP/2 framing
    - key: h2.is_http3
      type: bool
      description: Connection uses HTTP/3 (set here for cross-pivot when the H2 contributor sees the H3 upgrade)
    - key: h2.behind_proxy
      type: bool
      description: HTTP/2 framing info came from a downstream proxy header rather than the wire
    - key: h2.settings_fingerprint
      type: string
      description: HTTP/2 SETTINGS frame fingerprint - the most diagnostic single H2 signal for client identification
    - key: h2.pseudoheader_order
      type: string
      description: Order of pseudo-headers (:method :authority :path :scheme) - browsers and HTTP/2 libraries pin distinct orderings
    - key: h2.stream_priority
      type: string
      description: Stream priority pattern - browsers emit a characteristic priority tree; most automation does not
    - key: h2.uses_priority
      type: bool
      description: Client emitted PRIORITY frames (rare outside real browsers)
    - key: h2.window_update_pattern
      type: string
      description: WINDOW_UPDATE frame cadence pattern - cadence differs between Chrome, Firefox, Safari, curl-style clients
    - key: h2.window_update_count
      type: int
      description: Number of WINDOW_UPDATE frames observed during the connection
    - key: h2.push_enabled
      type: bool
      description: Client advertised acceptance of server-push frames in SETTINGS
    - key: h2.preface_valid
      type: bool
      description: HTTP/2 connection preface matched RFC 7540 - malformed preface is a strong scripted-client indicator
    - key: h2.population_http2_rate
      type: double
      description: Rolling % of HTTP/2 requests this fingerprint has produced (humans are mostly H2; tools are usually H1)
    - key: h2.population_samples
      type: int
      description: Sample count behind h2.population_http2_rate so the LLM can weight low-evidence rates
    - key: h2.fingerprint_unknown
      type: bool
      description: SETTINGS fingerprint doesn't match any known browser or bot - either a new client or one trying to hide
    - key: h2.analysis_error
      type: string
      description: Parser error message - present when H2 detail was malformed or unparseable

  on_failure:
    - detector.http2.failed

listens:
  required: []
  optional: []

lane:
  name: fast
  max_concurrency: 8
  priority: 100

# ============================================
# DEFAULT CONFIGURATION - NO MAGIC NUMBERS
# Override via appsettings.json: BotDetection:Detectors:Http2FingerprintContributor:*
# ============================================
defaults:
  weights:
    base: 1.0           # Base contribution weight
    bot_signal: 1.6     # HTTP/2 fingerprints are fairly reliable
    human_signal: 1.4   # Weight for known browser fingerprints
    verified: 1.8       # Weight for known automation fingerprints
    early_exit: 0.0     # Does not trigger early exit alone

  confidence:
    neutral: 0.0        # HTTP/2 appears normal or not HTTP/2
    bot_detected: 0.35  # Bot-like HTTP/2 fingerprint
    human_indicated: -0.25  # Known browser fingerprint (stronger human signal)
    strong_signal: 0.75 # Known bot framework fingerprint
    high_threshold: 0.7 # Threshold for "likely automation"
    low_threshold: 0.2  # Threshold for "likely browser"
    escalation_threshold: 0.5

  timing:
    timeout_ms: 25      # Very fast - header analysis
    cache_refresh_sec: 0  # No caching needed

  features:
    detailed_logging: false
    enable_cache: false
    can_early_exit: false
    can_escalate: false

  # HTTP/2-specific parameters
  parameters:
    # HTTP/1.1 penalty — calibrated against observed deployment norm
    http1_penalty_confidence: 0.1
    # Population calibration: suppress HTTP/1.1 penalty when local norm is HTTP/1.1
    population_min_samples: 20
    population_rate_threshold: 0.7
    # Fingerprint detection confidence values
    bot_fingerprint_confidence: 0.7
    browser_fingerprint_confidence: -0.2
    non_standard_pseudoheader_confidence: 0.3
    no_priority_confidence: 0.1
    no_window_updates_confidence: 0.15
    push_disabled_confidence: 0.12
    invalid_preface_confidence: 0.8
    # Pseudoheader order patterns
    browser_pseudoheader_orders:
      Chrome: ":method,:authority,:scheme,:path"
      Firefox: ":method,:path,:authority,:scheme"
      Safari: ":method,:scheme,:path,:authority"
    # SETTINGS frame fingerprint patterns (known browsers)
    browser_settings_patterns:
      - name: "Chrome_Desktop_90+"
        pattern: "1:65536,2:0,3:1000,4:6291456,6:262144"
      - name: "Firefox_Desktop"
        pattern: "1:65536,2:0,3:100,4:131072,5:16384"
      - name: "Safari_Desktop"
        pattern: "1:32768,2:0,3:100,4:2097152"
    # SETTINGS frame fingerprint patterns (known bots)
    bot_settings_patterns:
      - name: "Go_HTTP2_Client"
        pattern: "3:100,4:65536"
        confidence: 0.6
      - name: "Python_httpx"
        pattern: "3:100,4:6291456"
        confidence: 0.5
      - name: "Node_HTTP2"
        pattern: "1:4096,3:100,4:65536"
        confidence: 0.6
      - name: "cURL_HTTP2"
        pattern: "3:100,5:16384"
        confidence: 0.7
    # Headers to check for HTTP/2 data (from reverse proxy)
    h2_headers:
      - "X-H2-Settings"
      - "X-H2-Pseudoheaders"
      - "X-H2-Priority"

tags:
  - fast-path
  - fingerprinting
  - http2
  - stage-0
