# Endpoint History Detector - Per-endpoint historical response profile
# Reads the lifecycle store for the endpoint being requested and raises
# endpoint.* signals summarising its past 2xx/4xx history. Also nudges
# intent.threat_score when the endpoint has previously been abused.
name: EndpointHistory
priority: 6  # Wave 0 - alongside other historical/priors atoms
enabled: true
description: Raises per-endpoint lifecycle summary signals (last 2xx, first 4xx after 2xx, total 2xx, history-match) and nudges intent.threat_score when the endpoint has a hostile history

scope:
  sink: botdetection
  coordinator: detection
  atom: endpointhistory

taxonomy:
  kind: sensor
  determinism: deterministic
  persistence: ephemeral
  concern: priors

triggers:
  requires: []

emits:
  on_start:
    - detector.endpointhistory.started
  on_complete:
    - key: endpoint.history_match
      type: bool
      description: True when the current endpoint has non-empty prior lifecycle data
    - key: endpoint.last_2xx_utc
      type: string
      description: ISO-8601 timestamp of the endpoint's most recent 2xx response (when history exists)
    - key: endpoint.first_4xx_after_2xx_utc
      type: string
      description: ISO-8601 timestamp of the first 4xx that followed the endpoint's first 2xx (probing indicator)
    - key: endpoint.total_2xx
      type: int
      description: Total number of 2xx responses recorded for this endpoint in the current lifecycle window
    - key: intent.threat_score
      type: float
      description: Threat-score contribution from endpoint history (nudge, not authoritative)
  on_failure:
    - detector.endpointhistory.failed

listens:
  required: []
  optional:
    - request.path
    - request.method

lane:
  name: fast
  max_concurrency: 8
  priority: 110

defaults:
  weights:
    base: 1.0
    bot_signal: 1.4
    human_signal: 1.0
    verified: 0.0
    early_exit: 0.0

  confidence:
    neutral: 0.0
    bot_detected: 0.6
    human_indicated: 0.0
    strong_signal: 0.8
    high_threshold: 0.7
    low_threshold: 0.2
    escalation_threshold: 0.0

  timing:
    timeout_ms: 200
    cache_refresh_sec: 0

  features:
    detailed_logging: false
    enable_cache: true
    can_early_exit: false
    can_escalate: false

  parameters: {}

tags:
  - wave-0
  - priors
  - history
