# HTTP/3 (QUIC) Fingerprint Detector - QUIC transport parameter fingerprinting
name: Http3FingerprintContributor
priority: 14  # Runs after HTTP/2 (priority 13)
enabled: true
description: Analyzes QUIC transport parameters, version negotiation, 0-RTT resumption, and connection migration for automation detection

scope:
  sink: botdetection
  coordinator: detection
  atom: http3

taxonomy:
  kind: sensor
  determinism: deterministic
  persistence: ephemeral

# Input contract - what this detector consumes
input:
  accepts:
    - type: botdetection.request
      required: true
      description: HTTP request with HTTP/3 (QUIC) context
      signal_pattern: request.http3.*

  required_signals: []  # HTTP/3 data may not be available

  optional_signals:
    - request.http3.transport_params
    - request.http3.version
    - request.http3.zero_rtt
    - request.http3.connection_migrated

# Output contract - what this detector produces
output:
  produces:
    - type: botdetection.contribution
      description: HTTP/3 fingerprint analysis contribution

  signals:
    # Signal keys here MUST match the strings written via state.WriteSignal in
    # Http3FingerprintContributor.cs - the namespace is `h3.*`, not `detection.http3.*`.
    # SignalKeys constants H3Protocol/H3ClientType/H3ZeroRtt/H3ConnectionMigrated
    # all resolve to `h3.*` names.
    - key: h3.is_http3
      entity_type: boolean
      salience: 0.6
      description: Connection uses HTTP/3
    - key: h3.protocol
      entity_type: string
      salience: 0.6
      description: HTTP/3 protocol identifier (SignalKeys.H3Protocol)
    - key: h3.client_type
      entity_type: string
      salience: 0.9
      description: Matched known QUIC client fingerprint name (SignalKeys.H3ClientType)
    - key: h3.quic_version
      entity_type: string
      salience: 0.6
      description: QUIC version (v1, v2, draft)
    - key: h3.quic_v2
      entity_type: boolean
      salience: 0.4
      description: Connection negotiated QUIC v2
    - key: h3.transport_params
      entity_type: string
      salience: 0.8
      description: QUIC transport parameter fingerprint
    - key: h3.transport_fingerprint_unknown
      entity_type: boolean
      salience: 0.7
      description: Transport-params fingerprint doesn't match any known client
    - key: h3.zero_rtt
      entity_type: boolean
      salience: 0.5
      description: 0-RTT resumption was used (SignalKeys.H3ZeroRtt)
    - key: h3.connection_migrated
      entity_type: boolean
      salience: 0.5
      description: QUIC connection migration occurred (SignalKeys.H3ConnectionMigrated)
    - key: h3.spin_bit_disabled
      entity_type: boolean
      salience: 0.4
      description: Client disabled the QUIC spin bit (privacy / Tor-style behaviour)
    - key: h3.alt_svc_upgrade
      entity_type: boolean
      salience: 0.3
      description: Connection arrived via Alt-Svc upgrade from H2
    - key: h3.analysis_error
      entity_type: string
      salience: 0.2
      description: Parser error

triggers:
  requires: []  # No dependencies - runs first wave
  skip_when:
    - detection.early_exit

emits:
  on_start:
    - detector.http3.started

  on_complete:
    # Signal keys MUST match the strings written via state.WriteSignal in
    # Http3FingerprintContributor.cs (namespace `h3.*`). Descriptions are the
    # LLM reasoning surface - every signal carries its own.
    - key: h3.is_http3
      type: bool
      description: Connection uses HTTP/3 over QUIC
    - key: h3.protocol
      type: string
      description: HTTP/3 protocol identifier negotiated for the request (SignalKeys.H3Protocol)
    - key: h3.client_type
      type: string
      description: Matched known QUIC client fingerprint (SignalKeys.H3ClientType) - chrome-quic, firefox-quic, h3-go, etc.
    - key: h3.quic_version
      type: string
      description: QUIC version negotiated (v1, v2, IETF draft)
    - key: h3.quic_v2
      type: bool
      description: Connection negotiated QUIC v2 - distinguishes recent Chrome / Firefox builds from older clients
    - key: h3.transport_params
      type: string
      description: QUIC transport-parameter fingerprint - the H3 equivalent of the H2 SETTINGS fingerprint
    - key: h3.transport_fingerprint_unknown
      type: bool
      description: Transport-params fingerprint doesn't match any known client - new client or one trying to hide
    - key: h3.zero_rtt
      type: bool
      description: 0-RTT resumption was used (SignalKeys.H3ZeroRtt) - common for repeat human visits, rare for first-touch crawls
    - key: h3.connection_migrated
      type: bool
      description: QUIC connection migration occurred (SignalKeys.H3ConnectionMigrated) - mobile network changes; rare for automation
    - key: h3.spin_bit_disabled
      type: bool
      description: Client disabled the QUIC spin bit - privacy-focused clients (Tor over QUIC, hardened browsers)
    - key: h3.alt_svc_upgrade
      type: bool
      description: Connection arrived via Alt-Svc upgrade from HTTP/2 rather than direct QUIC negotiation
    - key: h3.analysis_error
      type: string
      description: Parser error message - present when QUIC framing detail was malformed or unparseable
    - key: transport.spoofed_edge_headers
      type: bool
      description: Untrusted peer sent edge fingerprint headers (possible spoof)

  on_failure:
    - detector.http3.failed

listens:
  required: []
  optional: []

lane:
  name: fast
  max_concurrency: 8
  priority: 100

# ============================================
# DEFAULT CONFIGURATION - NO MAGIC NUMBERS
# Override via appsettings.json: BotDetection:Detectors:Http3FingerprintContributor:*
# ============================================
defaults:
  weights:
    base: 1.0           # Base contribution weight
    bot_signal: 1.6     # QUIC fingerprints are fairly reliable
    human_signal: 1.4   # Weight for known browser QUIC fingerprints
    verified: 1.8       # Weight for known automation QUIC fingerprints
    early_exit: 0.0     # Does not trigger early exit alone

  confidence:
    neutral: 0.0        # HTTP/3 appears normal or not HTTP/3
    bot_detected: 0.35  # Bot-like QUIC fingerprint
    human_indicated: -0.25  # Known browser QUIC fingerprint (stronger human signal)
    strong_signal: 0.75 # Known bot QUIC framework fingerprint
    high_threshold: 0.7 # Threshold for "likely automation"
    low_threshold: 0.2  # Threshold for "likely browser"
    escalation_threshold: 0.5

  timing:
    timeout_ms: 25      # Very fast - header analysis
    cache_refresh_sec: 0  # No caching needed

  features:
    detailed_logging: false
    enable_cache: false
    can_early_exit: false
    can_escalate: false

  # HTTP/3-specific parameters
  parameters:
    # QUIC transport parameter fingerprint confidence values
    quic_bot_confidence: 0.6
    quic_browser_confidence: -0.2
    # 0-RTT resumption (returning visitor = human signal)
    zero_rtt_human_bonus: -0.15
    # Connection migration (mobile user = human signal)
    connection_migration_human_bonus: -0.1
    # Draft QUIC version (old/custom tooling = suspicious)
    draft_version_penalty: 0.3
    # Alt-Svc upgrade (HTTP/2 -> HTTP/3 negotiation = strong human signal)
    alt_svc_upgrade_bonus: -0.2
    # Known browser QUIC transport parameter patterns
    browser_transport_patterns:
      - name: "Chrome_QUIC"
        pattern: "initial_max_data=15728640"
      - name: "Firefox_QUIC"
        pattern: "initial_max_data=10485760"
      - name: "Safari_QUIC"
        pattern: "initial_max_data=8388608"
    # Known bot QUIC transport parameter patterns
    bot_transport_patterns:
      - name: "Go_QuicGo"
        pattern: "initial_max_data=1048576"
        confidence: 0.6
      - name: "Python_Aioquic"
        pattern: "initial_max_data=2097152"
        confidence: 0.5
      - name: "Curl_Quiche"
        pattern: "initial_max_data=10000000"
        confidence: 0.7
    # Headers to check for QUIC data (from reverse proxy)
    h3_headers:
      - "X-QUIC-Transport-Params"
      - "X-QUIC-Version"
      - "X-QUIC-0RTT"
      - "X-QUIC-Connection-Migrated"
      - "X-QUIC-Spin-Bit"
      - "X-QUIC-Alt-Svc-Used"
    # Spoofed edge-header detection
    spoofed_edge_headers_confidence: 0.3
    spoofed_edge_headers_weight: 1.2

tags:
  - fast-path
  - fingerprinting
  - http3
  - quic
  - stage-0
