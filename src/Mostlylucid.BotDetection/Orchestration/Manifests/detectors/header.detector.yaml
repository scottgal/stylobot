# Header Detector - Bot detection from HTTP header analysis
name: HeaderContributor
priority: 10  # Runs early with other stage-0 detectors
enabled: true
description: Analyzes HTTP headers for bot indicators (missing headers, ordering, consistency)

scope:
  sink: botdetection
  coordinator: detection
  atom: header

taxonomy:
  kind: sensor
  determinism: deterministic
  persistence: ephemeral

# Input contract - what this detector consumes
input:
  accepts:
    - type: botdetection.request
      required: true
      description: HTTP request with headers
      signal_pattern: request.headers.*

  required_signals:
    - request.headers

  optional_signals:
    - request.headers.accept
    - request.headers.accept-language
    - request.headers.accept-encoding

# Output contract - what this detector produces
output:
  produces:
    - type: botdetection.contribution
      description: Header analysis contribution to detection ledger
    - type: botdetection.header_signal
      description: Detailed header analysis signals

  signals:
    - key: detection.header.confidence
      entity_type: number
      salience: 0.6
      description: Bot confidence from header analysis
    - key: detection.header.missing_count
      entity_type: integer
      salience: 0.7
      description: Count of missing expected headers

triggers:
  requires: []  # No dependencies - runs first wave
  skip_when:
    - detection.early_exit

emits:
  on_start:
    - detector.header.started

  # Signal keys here MUST match the strings written via state.WriteSignal in
  # HeaderContributor.cs - the manifest is the source of truth for the
  # SignalCatalog "emitted by" provenance and for tooling (--output-config,
  # dashboard "what signals does this detector emit", benchmark scenario
  # filters). Drift between this list and the .cs writes means the dashboard
  # silently shows the wrong Source column.
  on_complete:
    - key: header.count
      type: int
      description: Total number of HTTP headers on the request
    - key: header.has_accept
      type: bool
      description: Request carries an Accept header
    - key: header.has_accept_encoding
      type: bool
      description: Request carries an Accept-Encoding header
    - key: header.has_accept_language
      type: bool
      description: Request carries an Accept-Language header
    - key: header.has_proxy_headers
      type: bool
      description: Request carries X-Forwarded-For or Via
    - key: header.is_service_worker_fetch
      type: bool
      description: Request looks like a Service Worker registration fetch
    - key: header.is_websocket_upgrade
      type: bool
      description: Request is a WebSocket upgrade (RFC 6455)
    - key: header.population_accept_rate
      type: double
      description: Rolling fraction of recent requests in the same UA bucket carrying Accept
    - key: header.population_accept_language_rate
      type: double
      description: Rolling fraction of recent requests in the same UA bucket carrying Accept-Language
    - key: header.sec_fetch_site
      type: string
      description: Value of the Sec-Fetch-Site header
    - key: header.sec_fetch_mode
      type: string
      description: Value of the Sec-Fetch-Mode header
    - key: header.sec_fetch_dest
      type: string
      description: Value of the Sec-Fetch-Dest header
    - key: header.sec_fetch_same_origin
      type: bool
      description: Sec-Fetch-Site == "same-origin"
    - key: attestation.fetch_metadata
      type: bool
      description: Request has browser fetch attestation (Sec-Fetch-Site present)
    - key: attestation.api_key
      type: bool
      description: Request carries a valid API key
    - key: attestation.programmatic
      type: bool
      description: Composite - any programmatic attestation signal present
    - key: headers.missing
      type: bool
      description: At least one expected browser header is absent

  on_failure:
    - detector.header.failed

listens:
  required: []
  optional: []

lane:
  name: fast
  max_concurrency: 8
  priority: 100

# ============================================
# DEFAULT CONFIGURATION - NO MAGIC NUMBERS
# Override via appsettings.json: BotDetection:Detectors:HeaderContributor:*
# ============================================
defaults:
  weights:
    base: 1.0           # Base contribution weight
    bot_signal: 1.2     # Weight when bot pattern detected
    human_signal: 1.2   # Weight for human indicators (stronger to balance bot asymmetry)
    verified: 1.5       # Weight for verified patterns
    early_exit: 2.0     # Weight for early-exit triggering patterns

  confidence:
    neutral: 0.0        # Headers appear normal
    bot_detected: 0.2   # Missing expected headers
    human_indicated: -0.15  # All expected headers present (stronger human signal)
    strong_signal: 0.5  # Multiple header anomalies
    high_threshold: 0.7 # Threshold for "likely bot"
    low_threshold: 0.2  # Threshold for "probably human"
    escalation_threshold: 0.4  # When to escalate

  timing:
    timeout_ms: 20      # Max execution time (very fast)
    cache_refresh_sec: 0  # No caching needed

  features:
    detailed_logging: false
    enable_cache: false
    can_early_exit: false
    can_escalate: false

  # Detector-specific parameters
  parameters:
    # Population calibration: suppress penalties when the deployment norm is sparse.
    # Same keys as clientside.detector.yaml and http2.detector.yaml — override per-detector.
    population_min_samples: 20
    population_rate_threshold: 0.7
    # Headers that should be present in browser requests
    expected_browser_headers:
      - "Accept"
      - "Accept-Language"
      - "Accept-Encoding"
    # Headers that indicate bots when present
    bot_indicator_headers:
      - "X-Forwarded-For"  # Not inherently bad, but track it
    # Missing header confidence penalty per header
    missing_header_penalty: 0.1
    # Order anomaly confidence penalty
    order_anomaly_penalty: 0.15
    # Minimum expected header count (below this is suspicious)
    min_header_count: 3
    # Check Accept-Language validity
    validate_accept_language: true

tags:
  - fast-path
  - header-analysis
  - stage-0
