name: WellKnownBot_Miss_HumanChrome
description: WellKnownBotIndex scan for a human Chrome UA — no match in YAML, compiled cache, or arcjet catalog. Measures the BoundedCache hit path after warmup.
detector: UserAgent
request:
  method: GET
  path: /
  ip: 203.0.113.42
  headers:
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
thresholds:
  max_mean_ns: 10000
  max_allocated_bytes: 4096
tags: [fast-path, useragent, human, well-known-bots, cache]